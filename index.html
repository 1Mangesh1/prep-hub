<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c4501b"><title>Prep</title><style>:root{--bg:#fbfaf8;--panel:#fff;--ink:#1d1d1f;--quiet:#6b6b70;--line:#e4e2dd;--accent:#c4501b}@media (prefers-color-scheme:dark){:root{--bg:#141414;--panel:#1d1d1d;--ink:#ecebe8;--quiet:#a3a3a8;--line:#2e2e2e;--accent:#e0703e}}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(380px,calc(100vw - 32px));box-sizing:border-box}h1{font-size:18px;margin:0 0 14px}input[type=password]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}button{width:100%;margin-top:12px;min-height:44px;font:inherit;border:0;border-radius:8px;background:var(--accent);color:#fff}label{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--quiet);font-size:14px}a.hub{display:block;margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}a.hub:hover,a.hub:focus-visible{border-color:var(--accent);outline:none}a.hub b{display:block}a.hub span{color:var(--quiet);font-size:14px}#msg{min-height:20px;margin:10px 0 0;color:var(--quiet);font-size:14px}</style></head>

async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault(); const pw = document.getElementById('pw').value; document.getElementById('msg').textContent = 'Unlocking...';

});
